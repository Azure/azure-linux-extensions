[SnapshotThread]

# Legacy entry: current backup code does not read this setting to control
# freezing. Do not rely on False to disable freezing; the backup workflow
# and application-plugin configuration determine freeze behavior.
# Filesystem freezing alone does not guarantee application consistency.
fsfreeze: True

# Set to True to use 'df -kl' (local filesystems only) instead of 'df -k' for
# size calculation. This excludes filesystems df classifies as remote,
# helping avoid delays caused by unavailable network mounts. It does not
# change which filesystems are frozen. Default: False
# onlyLocalFilesystems: True

# Comma-separated non-root mount points to exclude from filesystem freeze.
# Match paths exactly, without spaces after commas. An eligible root
# filesystem is still frozen even if '/' is listed.
# MountsToSkip:

# Snapshot ordering: 0=sequential for four or fewer disks, otherwise parallel;
# 1=sequential (programmatic), 2=sequential (customer).
# A failed parallel attempt can fall back to sequential snapshots.
# seqsnapshot: 0
